      summary: Crea un punto de emisión dentro de un establecimiento de la empresa activa.
      operationId: createEmissionPoint
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establishmentPublicId, code, name]
              properties:
                establishmentPublicId: { type: string, format: uuid }
                code: { type: string, pattern: '^\d{3}$' }
                name: { type: string, maxLength: 150 }
                isActive: { type: boolean, default: true }
      responses:
        "201":
          description: Punto de emisión creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionPointResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/emission-points/{emissionPoint}/sequence:
    put:
      tags: [Companies]
      summary: Define el primer secuencial de factura del RUC actual en el punto (p. ej. para continuar otro sistema).
      description: >-
        Sólo antes de que ese RUC emita su primera factura en el punto; después responde DOCUMENT_SEQUENCE_LOCKED.
        Por defecto la numeración empieza en 1.
      operationId: configureInitialSequential
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: emissionPoint, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [initialSequential], properties: { initialSequential: { type: integer, minimum: 1, maximum: 999999999 } } }
      responses:
        "200": { description: Punto con su numeración, content: { application/json: { schema: { $ref: "#/components/schemas/EmissionPointResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/emission-points/{emissionPoint}:
    parameters:
      - name: emissionPoint
