      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^\d{3}$' }
                name: { type: string, maxLength: 120 }
                address: { type: [string, "null"], maxLength: 255 }
                isActive: { type: boolean }
                isMain: { type: boolean }
