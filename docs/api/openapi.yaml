        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/items/{item}:
    parameters:
      - {
          name: item,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [Catalog]
      summary: Consulta un artículo de la empresa activa.
      operationId: getItem
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          {
            description: Artículo,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ItemResponse" } },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
    patch:
      tags: [Catalog]
      summary: Actualiza un artículo.
      operationId: updateItem
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UpdateItemRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Artículo actualizado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ItemResponse" } },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/items/{item}/activate:
    post:
      tags: [Catalog]
      summary: Activa un producto o servicio.
      operationId: activateItem
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        [
          {
            name: item,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Artículo actualizado,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/ItemResponse" } },
                },
            },
        }
  /api/v1/items/{item}/deactivate:
    post:
      tags: [Catalog]
      summary: Desactiva un artículo sin borrarlo físicamente.
      operationId: deactivateItem
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        [
          {
            name: item,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Artículo actualizado,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/ItemResponse" } },
                },
            },
        }
  /api/v1/items/{item}/taxes:
    put:
      tags: [Catalog]
      summary: Asigna tasas globales vigentes al artículo; exige exactamente una tarifa de IVA (ITEM_IVA_REQUIRED).
      operationId: syncItemTaxes
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        [
          {
            name: item,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [taxPublicIds],
                      properties:
                        {
                          taxPublicIds:
                            {
                              type: array,
                              items: { type: string, format: uuid },
                            },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Tasas asignadas,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ItemResponse" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/taxes:
    get:
      tags: [Taxes]
      summary: Tarifas oficiales que aplica la empresa (código y porcentaje vienen del catálogo FACSTO).
      operationId: listCompanyTaxes
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: usable, in: query, description: "1 = sólo las que un producto puede usar hoy", schema: { type: boolean } }
        - { name: tax_type, in: query, schema: { $ref: "#/components/schemas/TaxType" } }
      responses:
        "200": { description: Tarifas de la empresa, content: { application/json: { schema: { $ref: "#/components/schemas/TaxCollection" } } } }
    post:
      tags: [Taxes]
      summary: Aplica una tarifa oficial vigente a la empresa (OWNER/ADMIN). No crea códigos ni porcentajes.
      operationId: activateCompanyTax
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definitionPublicId]
              properties:
                definitionPublicId: { type: string, format: uuid }
                validFrom: { type: [string, "null"], format: date, description: Ventana opcional dentro de la vigencia oficial. }
                validUntil: { type: [string, "null"], format: date }
      responses:
        "201": { description: Tarifa aplicada, content: { application/json: { schema: { $ref: "#/components/schemas/TaxResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/taxes/{companyTax}/deactivate:
    post:
      tags: [Taxes]
      summary: Deja de ofrecer una tarifa para productos (OWNER/ADMIN). Responde COMPANY_TAX_IN_USE si hay productos que la usan.
      operationId: deactivateCompanyTax
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: companyTax, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Tarifa desactivada, content: { application/json: { schema: { $ref: "#/components/schemas/TaxResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/taxes/replacements/preview:
    post:
      tags: [Taxes]
      summary: Muestra cuántos productos cambiarían de una tarifa a otra del mismo impuesto.
      operationId: previewCompanyTaxReplacement
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TaxReplacementRequest" } } } }
      responses:
        "200":
          description: Impacto del reemplazo
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { from: { $ref: "#/components/schemas/Tax" }, to: { $ref: "#/components/schemas/Tax" }, itemCount: { type: integer } } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/taxes/replacements:
    post:
      tags: [Taxes]
      summary: Reemplaza la tarifa en todos los productos en una transacción; ventas y comprobantes conservan sus copias.
      operationId: replaceCompanyTax
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TaxReplacementRequest" } } } }
      responses:
        "200": { description: Productos actualizados, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { itemCount: { type: integer } } } } } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/tax-definitions:
    get:
      tags: [Taxes]
      summary: Catálogo normativo oficial de FACSTO (sólo lectura).
      operationId: listTaxDefinitions
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Definiciones oficiales, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SriTaxDefinition" } } } } } } }
  /api/v1/fiscal-rules:
    get:
      tags: [Taxes]
      summary: Reglas fiscales globales versionadas (sólo lectura; ninguna empresa las modifica).
      operationId: listFiscalRules
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Reglas fiscales, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/FiscalRule" } } } } } } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: facsto-api-session
      description: Cookie HttpOnly de Laravel; las peticiones de escritura requieren X-XSRF-TOKEN.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valor URL-decoded de la cookie XSRF-TOKEN.
  responses:
    AuthenticationError:
      description: La sesión no está autenticada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    CompanyAccessError:
      description: La empresa no existe, está inactiva o no pertenece al usuario autenticado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFoundError:
      description: El recurso público solicitado no existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ConflictError:
      description: La operación contradice una regla de integridad o negocio.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    CsrfError:
      description: Falta actualizar la cookie CSRF para la sesión actual.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ValidationError:
      description: Los datos enviados no pasan la validación.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  schemas:
    IdentificationType:
      type: string
      enum: [RUC, CEDULA, PASSPORT, FINAL_CONSUMER, FOREIGN_IDENTIFICATION]
    ItemType:
      type: string
      enum: [PRODUCT, SERVICE]
    Customer:
      type: object
      required:
        [publicId, identificationType, identification, legalName, isActive]
      properties:
        publicId: { type: string, format: uuid }
        identificationType: { $ref: "#/components/schemas/IdentificationType" }
        identification: { type: string, maxLength: 20 }
        legalName: { type: string, maxLength: 180 }
        commercialName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        isActive: { type: boolean }
    CreateCustomerRequest:
      type: object
      required: [identificationType, identification, legalName]
      properties:
        identificationType: { $ref: "#/components/schemas/IdentificationType" }
        identification: { type: string, maxLength: 20 }
        legalName: { type: string, maxLength: 180 }
        commercialName: { type: [string, "null"], maxLength: 180 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"], maxLength: 40 }
        address: { type: [string, "null"], maxLength: 255 }
    UpdateCustomerRequest:
      type: object
      properties:
        identificationType: { $ref: "#/components/schemas/IdentificationType" }
        identification: { type: string, maxLength: 20 }
        legalName: { type: string, maxLength: 180 }
        commercialName: { type: [string, "null"], maxLength: 180 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"], maxLength: 40 }
        address: { type: [string, "null"], maxLength: 255 }
    CustomerResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Customer" } }
    CustomerPage:
      type: object
      properties:
        {
          data:
            { type: array, items: { $ref: "#/components/schemas/Customer" } },
          meta: { type: object },
          links: { type: object },
        }
    TaxType:
      type: string
      enum: [IVA, ICE, IRBPNR]
    Tax:
      type: object
      description: Tarifa aplicada por la empresa; código y porcentaje vienen de su definición oficial.
      required: [publicId, name, taxType, sriCode, percentageCode, calculationType, definitionPublicId, isActive, isUsable]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        taxType: { $ref: "#/components/schemas/TaxType" }
        sriCode: { type: string }
        percentageCode: { type: string }
        percentage: { type: [string, "null"], format: decimal }
        calculationType: { type: string, enum: [PERCENTAGE, SPECIFIC, MIXED] }
        definitionPublicId: { type: string, format: uuid }
        officialValidFrom: { type: string, format: date }
        officialValidUntil: { type: [string, "null"], format: date }
        validFrom: { type: [string, "null"], format: date }
        validUntil: { type: [string, "null"], format: date }
        legalBasis: { type: string }
        isActive: { type: boolean }
        isUsable: { type: boolean }
    TaxResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Tax" } }
    TaxCollection:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/Tax" } } }
    TaxReplacementRequest:
      type: object
      required: [fromPublicId, toPublicId]
      properties:
        fromPublicId: { type: string, format: uuid }
        toPublicId: { type: string, format: uuid }
    SriTaxDefinition:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        taxType: { $ref: "#/components/schemas/TaxType" }
        sriCode: { type: string }
        percentageCode: { type: string }
        calculationType: { type: string, enum: [PERCENTAGE, SPECIFIC, MIXED] }
        percentage: { type: [string, "null"] }
        specificRate: { type: [string, "null"] }
        specificUnit: { type: [string, "null"] }
        calculationSupported: { type: boolean }
        validFrom: { type: string, format: date }
        validUntil: { type: [string, "null"], format: date }
        legalBasis: { type: string }
        isCurrent: { type: boolean }
    FiscalRule:
      type: object
      properties:
        code: { type: string, enum: [FINAL_CONSUMER_MAX_TOTAL, MAX_TIP_PERCENTAGE] }
        valueType: { type: string, enum: [DECIMAL, STRING] }
        value: { type: string }
        validFrom: { type: string, format: date }
        validUntil: { type: [string, "null"], format: date }
        legalBasis: { type: string }
        isCurrent: { type: boolean }
    Item:
      type: object
      required: [publicId, type, internalCode, name, unit, salePrice, isActive]
      properties:
        publicId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ItemType" }
        internalCode: { type: string, maxLength: 25 }
        auxiliaryCode: { type: [string, "null"], maxLength: 25 }
        name: { type: string, maxLength: 180 }
        description: { type: [string, "null"] }
        unit: { type: string, maxLength: 32 }
        salePrice: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
        isActive: { type: boolean }
        taxes: { type: array, items: { $ref: "#/components/schemas/Tax" } }
    CreateItemRequest:
      type: object
      required: [type, internalCode, name, unit, salePrice]
      properties:
        type: { $ref: "#/components/schemas/ItemType" }
        internalCode: { type: string, maxLength: 25 }
        auxiliaryCode: { type: [string, "null"], maxLength: 25 }
        name: { type: string, maxLength: 180 }
        description: { type: [string, "null"] }
        unit: { type: string, maxLength: 32 }
        salePrice: { type: string, pattern: '^\d{1,12}(\.\d{1,6})?$' }
    UpdateItemRequest:
      type: object
      properties:
        type: { $ref: "#/components/schemas/ItemType" }
        internalCode: { type: string, maxLength: 25 }
        auxiliaryCode: { type: [string, "null"], maxLength: 25 }
        name: { type: string, maxLength: 180 }
        description: { type: [string, "null"] }
        unit: { type: string, maxLength: 32 }
        salePrice: { type: string, pattern: '^\d{1,12}(\.\d{1,6})?$' }
    ItemResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Item" } }
    ItemPage:
      type: object
      properties:
        {
          data: { type: array, items: { $ref: "#/components/schemas/Item" } },
          meta: { type: object },
          links: { type: object },
        }
    CompanySetupState:
      type: string
      enum: [ISSUER_REQUIRED, EMISSION_REQUIRED, CERTIFICATE_REQUIRED, READY]
    SaleStatus:
      type: string
      enum: [DRAFT, DOCUMENT_PREPARED, CANCELLED]
    DocumentType:
      type: string
      enum: [INVOICE]
    DocumentStatus:
      type: string
      enum: [DRAFT, NUMBERED, XML_BUILT, SIGNED, QUEUED, RECEIVED, RETURNED, PENDING_AUTHORIZATION, AUTHORIZED, NOT_AUTHORIZED, FAILED]
    SalePaymentMethod:
      type: object
      required: [fiscalPaymentMethodPublicId, amount]
      properties:
        fiscalPaymentMethodPublicId: { type: string, format: uuid }
        methodCode: { type: string, description: Snapshot que devuelve la API en la venta. }
        methodName: { type: string, description: Snapshot que devuelve la API en la venta. }
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        reference: { type: [string, "null"], maxLength: 120 }
        term: { type: [string, "null"], pattern: '^\d+(\.\d{1,2})?$' }
        timeUnit: { type: [string, "null"], enum: [DAY, MONTH] }
    SaleDraftRequest:
      type: object
      properties:
        customerPublicId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 2000 }
        tipAmount: { type: [string, "null"], pattern: '^\d{1,14}(\.\d{1,2})?$', description: Propina; no supera MAX_TIP_PERCENTAGE del subtotal (TIP_MAX_PERCENTAGE_EXCEEDED). }
        lines:
          type: array
          maxItems: 100
          items:
            type: object
            required: [itemPublicId, quantity]
            properties:
              itemPublicId: { type: string, format: uuid }
              quantity: { type: string, pattern: '^\d{1,9}(\.\d{1,6})?$' }
              discountAmount: { type: [string, "null"], pattern: '^\d{1,14}(\.\d{1,2})?$' }
        paymentMethods: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SalePaymentMethod" } }
    SaleLine:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        itemPublicId: { type: [string, "null"], format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        unit: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        discountAmount: { type: string }
        subtotal: { type: string }
        taxableBase: { type: string }
        taxTotal: { type: string }
        total: { type: string }
        taxes: { type: array, items: { type: object } }
        paymentMethods: { type: array, items: { type: object } }
    Sale:
      type: object
      required: [publicId, number, status, customer, subtotal, discountTotal, taxTotal, tipAmount, total, currency, createdAt]
      properties:
        publicId: { type: string, format: uuid }
        number: { type: string, pattern: '^V-\d{5,}$', description: Consecutivo interno por empresa; no es el secuencial del SRI. }
        status: { $ref: "#/components/schemas/SaleStatus" }
        issueDate: { type: [string, "null"], format: date, description: Fecha fiscal fijada al emitir el comprobante. }
        customer: { type: object, properties: { publicId: { type: [string, "null"], format: uuid }, identificationType: { type: string }, identification: { type: string }, name: { type: string }, address: { type: [string, "null"] }, email: { type: [string, "null"] } } }
        createdBy: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        subtotal: { type: string }
        discountTotal: { type: string }
        taxTotal: { type: string }
        tipAmount: { type: string }
        total: { type: string, description: Subtotal - descuentos + impuestos + propina. }
        currency: { type: string, const: USD }
        document:
          type: [object, "null"]
          description: Resumen del comprobante electrónico nacido de la venta.
          properties:
            publicId: { type: string, format: uuid }
            fullNumber: { type: string }
            accessKey: { type: string }
            status: { $ref: "#/components/schemas/DocumentStatus" }
            issueDate: { type: [string, "null"], format: date }
            environment: { type: [string, "null"], enum: [TEST, PRODUCTION, null] }
            authorizationNumber: { type: [string, "null"] }
            authorizedAt: { type: [string, "null"], format: date-time }
            lastErrorCode: { type: [string, "null"] }
        lines: { type: array, items: { $ref: "#/components/schemas/SaleLine" } }
        paymentMethods: { type: array, items: { $ref: "#/components/schemas/SalePaymentMethod" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaleResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Sale" } }
    SalePage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Sale" } }
        links: { type: object }
        meta: { type: object }
    DashboardSummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            counts:
              type: object
              properties:
                customers: { type: integer }
                activeCustomers: { type: integer }
                items: { type: integer }
                activeItems: { type: integer }
                draftSales: { type: integer }
            recentSales: { type: array, items: { $ref: "#/components/schemas/Sale" } }
    CompanySetupStatus:
      type: object
      required: [state, ready, canIssueDocuments, issuerReady, emissionReady, certificateReady, onboardingRequired]
      properties:
        state: { $ref: "#/components/schemas/CompanySetupState" }
        ready: { type: boolean }
        canIssueDocuments: { type: boolean, description: Configuración completa con certificado vigente; requisito para firmar y enviar al SRI. }
        issuerReady: { type: boolean }
        emissionReady: { type: boolean }
        certificateReady: { type: boolean }
        onboardingRequired: { type: boolean, description: "Verdadero sólo para uno de los dos primeros administradores (OWNER/ADMIN) de la empresa que aún no completó ni omitió la bienvenida, mientras la empresa no esté lista. Empleados y administradores posteriores siempre reciben falso." }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          properties: { publicId: { type: string, format: uuid }, isActive: { type: boolean } }
    CategoryResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Category" } }
    CategoryPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/Category" } }, meta: { type: object }, links: { type: object } }
    FiscalPaymentMethod:
      type: object
      properties: { publicId: { type: string, format: uuid }, code: { type: string }, name: { type: string }, validFrom: { type: string, format: date }, validUntil: { type: [string, "null"], format: date } }
    FiscalPaymentMethodPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/FiscalPaymentMethod" } }, meta: { type: object }, links: { type: object } }
    ElectronicDocument:
      type: object
      required: [publicId, documentType, fullNumber, accessKey, issueDate, status, customer, totals]
      properties:
        publicId: { type: string, format: uuid }
        salePublicId: { type: [string, "null"], format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        fullNumber: { type: string, pattern: '^\d{3}-\d{3}-\d{9}$' }
        sequential: { type: string, pattern: '^\d{9}$' }
        accessKey: { type: string, pattern: '^\d{49}$' }
        issueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        environment: { type: [string, "null"], enum: [TEST, PRODUCTION, null] }
        authorizationNumber: { type: [string, "null"] }
        authorizedAt: { type: [string, "null"], format: date-time, description: fechaAutorizacion oficial del SRI }
        lastSriStatusAt: { type: [string, "null"], format: date-time }
        lastErrorCode: { type: [string, "null"] }
        transmissionBlockedReason: { type: [string, "null"], enum: [TRANSPORT_DISABLED, COMPANY_SUBMISSION_DISABLED, PROVIDER_NOT_REGISTERED, null] }
        timeline: { $ref: "#/components/schemas/InvoiceTimeline" }
        customer: { type: object }
        totals: { type: object }
        lines: { type: array, items: { type: object } }
        taxes: { type: array, items: { type: object } }
    InvoiceTimeline:
      type: object
      properties:
        numberedAt: { type: [string, "null"], format: date-time }
        xmlBuiltAt: { type: [string, "null"], format: date-time }
        signedAt: { type: [string, "null"], format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
        receivedAt: { type: [string, "null"], format: date-time }
        authorizedAt: { type: [string, "null"], format: date-time }
    DocumentArtifactType:
      type: string
      enum: [UNSIGNED_XML, SIGNED_XML, AUTHORIZED_XML, RIDE]
    DocumentArtifact:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DocumentArtifactType" }
        version: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer }
        mimeType: { type: string }
        createdAt: { type: string, format: date-time }
    SriMessage:
      type: object
      properties:
        identifier: { type: [string, "null"] }
        type: { type: [string, "null"], description: ERROR, ADVERTENCIA o INFORMATIVO }
        message: { type: string }
        additionalInformation: { type: [string, "null"] }
    SriSubmission:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        operation: { type: string, enum: [RECEPTION, AUTHORIZATION, QUERY] }
        attempt: { type: integer, minimum: 1 }
        environment: { type: string, enum: [TEST, PRODUCTION] }
        status: { type: string, enum: [IN_PROGRESS, RECEIVED, RETURNED, AUTHORIZED, NOT_AUTHORIZED, PENDING, BLOCKED, TRANSPORT_ERROR, RESPONSE_INVALID] }
        httpStatus: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        messages: { type: array, items: { $ref: "#/components/schemas/SriMessage" } }
    InvoiceSriStatus:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        environment: { type: [string, "null"], enum: [TEST, PRODUCTION, null] }
        accessKey: { type: string, pattern: '^\d{49}$' }
        authorizationNumber: { type: [string, "null"] }
        authorizedAt: { type: [string, "null"], format: date-time }
        lastSriStatusAt: { type: [string, "null"], format: date-time }
        lastErrorCode: { type: [string, "null"] }
        transmissionBlockedReason: { type: [string, "null"] }
        canRetry: { type: boolean }
        timeline: { $ref: "#/components/schemas/InvoiceTimeline" }
        artifacts: { type: array, items: { $ref: "#/components/schemas/DocumentArtifactType" } }
        rideAvailable: { type: boolean }
        authorizedXmlAvailable: { type: boolean }
        submissions: { type: array, items: { $ref: "#/components/schemas/SriSubmission" } }
        delivery:
          type: [object, "null"]
          properties:
            channel: { type: string, enum: [EMAIL] }
            status: { type: string, enum: [PENDING, SENT, FAILED, SKIPPED_SMTP_NOT_CONFIGURED, SKIPPED_NO_RECIPIENT] }
            recipient: { type: [string, "null"] }
            attempts: { type: integer }
            sentAt: { type: [string, "null"], format: date-time }
    InvoiceSriStatusResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/InvoiceSriStatus" } }
    ElectronicDocumentResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/ElectronicDocument" } }
    FiscalProfileInput:
      type: object
      properties:
        accountingRequired: { type: boolean }
        specialTaxpayerNumber: { type: [string, "null"], maxLength: 20 }
        withholdingAgentNumber: { type: [string, "null"], maxLength: 20 }
        artisanQualificationNumber: { type: [string, "null"], maxLength: 30, description: Número de calificación artesanal; se congela en cada comprobante y sale en el RIDE. }
        rimpeType: { type: [string, "null"], enum: [ENTREPRENEUR, POPULAR_BUSINESS, null] }
    FiscalProfile:
      allOf:
        - $ref: "#/components/schemas/FiscalProfileInput"
        - type: object
          required: [accountingRequired]
    FiscalProfileResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/FiscalProfile" } }
    ElectronicDocumentPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ElectronicDocument" } }, meta: { type: object }, links: { type: object } }
    CompanySetupStatusResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/CompanySetupStatus" } }
    SriEnvironment:
      type: string
      enum: [TEST, PRODUCTION]
    EmissionType:
      type: string
      enum: [NORMAL]
    IssuerConfiguration:
      type: object
      required: [ruc, legalName, mainAddress]
      properties:
        ruc: { type: string, pattern: '^\d{13}$' }
        legalName: { type: string, maxLength: 180 }
        commercialName: { type: [string, "null"], maxLength: 180 }
        mainAddress: { type: string, maxLength: 255 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"], maxLength: 40 }
    EmissionConfiguration:
      type: object
      required: [establishmentCode, establishmentName, emissionPointCode, emissionPointName]
      properties:
        establishmentCode: { type: string, pattern: '^\d{3}$' }
        establishmentName: { type: string, maxLength: 120 }
        establishmentAddress: { type: [string, "null"], maxLength: 255 }
        emissionPointCode: { type: string, pattern: '^\d{3}$' }
        emissionPointName: { type: string, maxLength: 120 }
        environment:
          { $ref: "#/components/schemas/SriEnvironment", default: TEST }
        emissionType:
          { $ref: "#/components/schemas/EmissionType", default: NORMAL }
    UploadCertificateRequest:
      type: object
      required: [certificate, password]
      properties:
        certificate: { type: string, format: binary }
        password: { type: string, format: password, maxLength: 4096 }
    DigitalCertificateSummary:
      type: object
      required:
        [publicId, issuedTo, issuer, validFrom, validUntil, status, isActive]
      properties:
        publicId: { type: string, format: uuid }
        issuedTo: { type: string }
        subjectRuc: { type: [string, "null"], pattern: '^\d{13}$' }
        issuer: { type: string }
        serialNumber: { type: [string, "null"] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        status: { type: string, enum: [VALID, INVALID, EXPIRED, NOT_YET_VALID, RUC_NOT_FOUND, RUC_MISMATCH] }
        validationErrorCode: { type: [string, "null"] }
        isActive: { type: boolean }
    DigitalCertificateResponse:
      type: object
      properties:
        { data: { $ref: "#/components/schemas/DigitalCertificateSummary" } }
    HealthResponse:
      type: object
      required: [status, services]
      properties:
        status: { type: string, enum: [ok, degraded] }
        services:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 255 }
        remember: { type: boolean, default: false }
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          required: [name, ruc, main_address, password_confirmation]
          properties:
            name: { type: string, maxLength: 120 }
            phone: { type: string, maxLength: 40, nullable: true }
            ruc: { type: string, pattern: '^\\d{13}$' }
            main_address: { type: string, maxLength: 255 }
            password_confirmation: { type: string, format: password }
    User:
      type: object
      required: [publicId, name, email, phone, hasProfilePhoto]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        hasProfilePhoto: { type: boolean }
    UserResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/User" }
    CompanyRole:
      type: string
      enum: [OWNER, ADMIN, BILLER, VIEWER]
    Company:
      type: object
      required: [publicId, slug, accountingRequired, status, role, hasLogo, sriEnvironment]
      properties:
        publicId: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', description: Identificador de la suscripción y futuro subdominio. }
        ruc: { type: [string, "null"], pattern: '^\d{13}$' }
        legalName: { type: [string, "null"] }
        commercialName: { type: [string, "null"] }
        mainAddress: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        accountingRequired: { type: boolean }
        hasLogo: { type: boolean }
        sriEnvironment: { type: [string, "null"], enum: [TEST, PRODUCTION, null] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        role: { $ref: "#/components/schemas/CompanyRole" }
        activeCertificate:
          type: [object, "null"]
          description: Firma electrónica activa; sólo se expone si puede firmar para el RUC actual.
          properties:
            usable: { type: boolean }
        electronicInvoicing:
          type: object
          properties:
            enabled: { type: boolean }
            requirements:
              type: object
              properties:
                companyData: { type: boolean }
                certificate: { type: boolean }
                emission: { type: boolean }
                environment: { type: boolean }
    CompanyWrite:
      type: object
      properties:
        legalName: { type: [string, "null"], maxLength: 180 }
        commercialName: { type: [string, "null"], maxLength: 180 }
        mainAddress: { type: [string, "null"], maxLength: 255 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"], maxLength: 40 }
    CompanyPatch:
      type: object
      properties:
        legalName: { type: string, maxLength: 180 }
        commercialName: { type: [string, "null"], maxLength: 180 }
        mainAddress: { type: string, maxLength: 255 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"], maxLength: 40 }
    CompanyResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Company" }
    CompanyCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Company" }
    Membership:
      type: object
      properties:
        userPublicId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/CompanyRole" }
        isActive: { type: boolean }
        joinedAt: { type: [string, "null"], format: date-time }
    MembershipResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Membership" }
    Establishment:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{3}$' }
        name: { type: string }
        address: { type: [string, "null"] }
        isActive: { type: boolean }
        isMain: { type: boolean }
    EstablishmentResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Establishment" }
    EstablishmentCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Establishment" }
    EmissionPoint:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        establishmentPublicId: { type: string, format: uuid }
        establishmentCode: { type: string, pattern: '^\d{3}$' }
        code: { type: string, pattern: '^\d{3}$' }
        name: { type: string }
        isActive: { type: boolean }
        isDefault: { type: boolean }
        sequence:
          type: object
          description: Numeración de facturas del RUC actual de la empresa en este punto.
          properties:
            issuerRuc: { type: [string, "null"] }
            initialSequential: { type: integer }
            nextSequential: { type: integer }
            locked: { type: boolean, description: true cuando el RUC ya emitió en este punto; la numeración no se puede redefinir. }
    EmissionPointResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/EmissionPoint" }
    EmissionPointCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/EmissionPoint" }
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
