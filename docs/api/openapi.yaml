openapi: 3.1.0
info:
  title: FACSTO API
  version: 1.0.0
  description: API fiscal de FACSTO. La autenticación de FACSTO Web usa cookies de sesión y CSRF.
servers:
  - url: http://localhost:8000
tags:
  - name: System
  - name: Authentication
  - name: Account
  - name: Companies
  - name: Fiscal structure
  - name: Customers
  - name: Catalog
  - name: Sales
  - name: Setup
paths:
  /health:
    get:
      tags: [System]
      summary: Comprueba la disponibilidad de FACSTO y sus dependencias.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API, PostgreSQL, Redis y almacenamiento privado disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Una o más dependencias no están disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      summary: Inicializa las cookies CSRF para la sesión SPA.
      operationId: initializeCsrf
      security: []
      responses:
        "204":
          description: Laravel emitió las cookies XSRF-TOKEN y de sesión.
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Autentica al usuario y establece la cookie de sesión.
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "419":
          $ref: "#/components/responses/CsrfError"
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Cierra la sesión FACSTO actual.
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "419":
          $ref: "#/components/responses/CsrfError"
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Devuelve el usuario de la sesión actual.
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
    patch:
      tags: [Account]
      summary: Actualiza nombre, teléfono o correo del usuario actual.
      description: Cambiar el correo exige `currentPassword`. El correo se guarda en minúsculas.
      operationId: updateCurrentUserProfile
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                phone: { type: string, nullable: true, maxLength: 40 }
                currentPassword: { type: string, description: Obligatoria sólo si cambia el correo. }
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/me/password:
    put:
      tags: [Account]
      summary: Cambia la contraseña del usuario actual.
      description: Las demás sesiones del navegador se cierran al cambiar el hash de la contraseña; la sesión actual se regenera.
      operationId: changeCurrentUserPassword
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, passwordConfirmation]
              properties:
                currentPassword: { type: string }
                password: { type: string, minLength: 10, description: Debe incluir letras y números y ser distinta de la actual. }
                passwordConfirmation: { type: string }
      responses:
        "200":
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/me/photo:
    get:
      tags: [Account]
      summary: Devuelve la foto de perfil privada del usuario actual.
      operationId: getCurrentUserPhoto
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Archivo de imagen.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Account]
      summary: Sube o reemplaza la foto de perfil (PNG, JPG o WebP, máximo 3 MB y 2048 px).
      operationId: uploadCurrentUserPhoto
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: Foto actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Account]
      summary: Elimina la foto de perfil del usuario actual.
      operationId: deleteCurrentUserPhoto
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Foto eliminada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /api/v1/company:
    get:
      tags: [Companies]
      summary: Devuelve la empresa del usuario autenticado.
      description: Cada usuario pertenece a una sola empresa (una suscripción = una empresa). La empresa se resuelve en el servidor a partir de la membresía; el cliente nunca la envía.
      operationId: getCompany
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Empresa solicitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Companies]
      summary: Actualiza la empresa del usuario autenticado (ADMIN u OWNER).
      operationId: updateCompany
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatch"
      responses:
        "200":
          description: Empresa actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/company/fiscal-identity:
    post:
      tags: [Companies]
      summary: Datos de la empresa, RUC y firma electrónica en un solo guardado (todo o nada).
      description: >-
        Todos los campos son obligatorios y el RUC tiene exactamente 13 dígitos. La firma se valida contra el RUC
        enviado (no contra el guardado), así el RUC demo nunca la rechaza. `certificate` es obligatorio si el RUC no tiene
        una firma vigente activa, y siempre que el RUC cambia. Si la firma se rechaza (CERTIFICATE_*) no se guarda nada.
        Cambiar de RUC exige que no haya comprobantes del RUC actual sin autorizar (COMPANY_RUC_CHANGE_BLOCKED) y el
        RUC nuevo empieza su propia numeración; la del anterior se conserva.
      operationId: saveCompanyFiscalIdentity
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ruc, legalName, commercialName, mainAddress, email, phone]
              properties:
                ruc: { type: string, pattern: '^\d{13}$' }
                legalName: { type: string, maxLength: 180 }
                commercialName: { type: string, maxLength: 180 }
                mainAddress: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 254 }
                phone: { type: string, pattern: '^\d{9,10}$' }
                certificate: { type: string, format: binary, description: Archivo .p12/.pfx del RUC enviado (máx. 10 MB). }
                password: { type: string, format: password, description: Obligatoria con certificate; sólo viaja en esta petición. }
      responses:
        "200": { description: Empresa guardada con su firma activa, content: { application/json: { schema: { $ref: "#/components/schemas/CompanyResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/company/electronic-invoicing:
    put:
      tags: [Companies]
      summary: «Activar facturación electrónica» (envío al SRI de la empresa).
      description: >-
        Sólo se activa con la lista completa (datos de la empresa, firma vigente del RUC, establecimiento y punto,
        ambiente); si falta algo responde ELECTRONIC_INVOICING_REQUIREMENTS_PENDING con `details.pending`.
        Cambiar de RUC lo desactiva. Sigue haciendo falta SRI_TRANSPORT_ENABLED en el servidor.
      operationId: setElectronicInvoicing
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: Empresa con el estado del activador, content: { application/json: { schema: { $ref: "#/components/schemas/CompanyResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/company/logo:
    get:
      tags: [Companies]
      summary: Devuelve el logo privado a miembros activos de la empresa.
      operationId: getCompanyLogo
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Archivo de imagen del logo.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Companies]
      summary: Sube o reemplaza el logo de la empresa en almacenamiento privado.
      operationId: uploadCompanyLogo
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPG o WebP de hasta 3 MB.
      responses:
        "200":
          description: Logo actualizado; la ruta privada no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Companies]
      summary: Quita el logo de la empresa.
      operationId: deleteCompanyLogo
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Logo eliminado del almacenamiento privado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
  /api/v1/company/members:
    post:
      tags: [Companies]
      summary: Agrega un usuario a la empresa con un rol local.
      operationId: addCompanyMember
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userPublicId, role]
              properties:
                userPublicId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/CompanyRole" }
      responses:
        "201":
          description: Membresía creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/company/members/{userPublicId}:
    parameters:
      - name: userPublicId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Companies]
      summary: Desactiva la membresía, protegiendo al último OWNER activo.
      operationId: removeCompanyMember
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Membresía desactivada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isActive: { type: boolean, const: false }
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v1/company/members/{userPublicId}/reactivate:
    parameters:
      - {
          name: userPublicId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [Companies]
      summary: Reactiva la membresía conservada de un usuario.
      operationId: reactivateCompanyMember
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          {
            description: Membresía reactivada,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipResponse" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/company/members/{userPublicId}/role:
    parameters:
      - {
          name: userPublicId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [Companies]
      summary: Cambia un rol respetando la jerarquía OWNER y ADMIN.
      operationId: updateCompanyMemberRole
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [role],
                      properties:
                        { role: { $ref: "#/components/schemas/CompanyRole" } },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Rol actualizado,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipResponse" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/dashboard/summary:
    get:
      tags: [Sales]
      summary: Devuelve un resumen operativo agregado para la empresa activa.
      operationId: getDashboardSummary
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Conteos y borradores recientes; no incluye métricas fiscales inexistentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummaryResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/sales:
    get:
      tags: [Sales]
      summary: Lista las ventas de la empresa con el resumen de su comprobante electrónico.
      operationId: listSales
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SaleStatus" } }
        - { name: stage, in: query, description: "draft = borradores; prepared = NUMBERED/XML_BUILT/SIGNED; sent = QUEUED/RECEIVED/PENDING_AUTHORIZATION; authorized = AUTHORIZED; problems = RETURNED/NOT_AUTHORIZED/FAILED", schema: { type: string, enum: [draft, prepared, sent, authorized, problems] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Página de ventas de la empresa seleccionada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalePage" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Sales]
      summary: Crea un borrador y calcula sus valores en FACSTO API.
      operationId: createSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleDraftRequest" }
      responses:
        "201":
          description: Borrador guardado con snapshots de cliente, artículo e impuestos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sales/{sale}:
    parameters:
      - name: sale
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Sales]
      summary: Consulta un borrador por UUID público dentro de la empresa activa.
      operationId: getSale
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Datos y snapshots del borrador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    patch:
      tags: [Sales]
      summary: Recalcula y actualiza un borrador que todavía no fue cancelado.
      operationId: updateSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleDraftRequest" }
      responses:
        "200":
          description: Borrador actualizado y recalculado en Laravel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sales/{sale}/cancel:
    post:
      tags: [Sales]
      summary: Cancela un borrador sin eliminarlo físicamente.
      operationId: cancelSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: sale
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Borrador marcado como CANCELLED y auditado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/sales/{sale}/issue:
    post:
      tags: [FiscalDocuments]
      summary: Único comando de emisión; F04 (numerar) → F05 (XML y firma) → encolar F06 (SRI).
      description: >-
        No se asigna secuencial, número ni clave de acceso hasta que la empresa pueda continuar hacia XML, firma y SRI:
        empresa activa, emisor y estructura de emisión completos, certificado vigente, legible y del mismo RUC que el emisor,
        RUC del proveedor configurado y venta lista. Si falta algo responde FISCAL_SETUP_INCOMPLETE con `details.pending`
        (`issuer`, `emission`, `certificate`, `certificate_unreadable`, `company_inactive`), SRI_PROVIDER_NOT_CONFIGURED o
        SALE_NOT_READY_FOR_INVOICE (`final_consumer_limit`, `tip_limit`, `taxes`, …). Numerada la venta, genera el XML 1.1.0,
        lo valida con el XSD, lo firma (XAdES-BES), verifica la firma y lo encola para el SRI si `SriTransmissionGate` lo
        permite; si no, queda SIGNED con `transmissionBlockedReason`. Llamarlo otra vez reanuda desde el estado actual sin
        volver a numerar. Si un paso de F05 falla, el error incluye `details.invoicePublicId`, `details.invoiceStatus` y
        `details.reason_code` (por ejemplo DIGEST_MISMATCH, KEYSTORE_UNREADABLE, XML_SCHEMA_INVALID).
      operationId: issueSaleInvoice
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: sale, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Venta numerada en esta llamada y procesada hasta su estado actual, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "200": { description: Documento existente reanudado sin nuevo secuencial, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/invoices:
    get:
      tags: [FiscalDocuments]
      summary: Lista facturas numeradas de la empresa activa.
      operationId: listInvoices
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DocumentStatus" } }
      responses:
        "200": { description: Página de comprobantes fiscales, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentPage" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/invoices/{invoice}:
    get:
      tags: [FiscalDocuments]
      summary: Consulta un comprobante mediante su UUID público.
      operationId: getInvoice
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Identidad fiscal y snapshots, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /api/v1/invoices/{invoice}/sri-status:
    get:
      tags: [FiscalDocuments]
      summary: Estado frente al SRI, línea de tiempo, intentos con sus mensajes oficiales y entrega.
      operationId: getInvoiceSriStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Trazabilidad F06/F07, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceSriStatusResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /api/v1/invoices/{invoice}/retry-sri:
    post:
      tags: [FiscalDocuments]
      summary: Reintento controlado con el mismo número y clave de acceso.
      description: >-
        NUMBERED/RETURNED/NOT_AUTHORIZED reconstruyen y firman; XML_BUILT firma; SIGNED o FAILED con XML firmado se
        encolan otra vez; RECEIVED y PENDING_AUTHORIZATION sólo vuelven a consultar la autorización.
        AUTHORIZED responde INVOICE_RETRY_NOT_ALLOWED.
      operationId: retryInvoiceSri
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documento en su nuevo estado, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/invoices/{invoice}/artifacts:
    get:
      tags: [FiscalDocuments]
      summary: Archivos privados y versionados del comprobante con su SHA-256.
      operationId: listInvoiceArtifacts
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Artefactos
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/DocumentArtifact" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/invoices/{invoice}/artifacts/{type}:
    get:
      tags: [FiscalDocuments]
      summary: Descarga la última versión de un artefacto (XML o RIDE).
      description: >-
        `type` acepta UNSIGNED_XML, SIGNED_XML, AUTHORIZED_XML o RIDE (también en minúsculas con guiones). El RIDE sólo
        existe para un comprobante AUTHORIZED y se genera si aún no está guardado. Antes de servir se verifica el SHA-256
        (DOCUMENT_ARTIFACT_INTEGRITY_FAILED); la respuesta incluye `X-Artifact-Sha256`.
      operationId: downloadInvoiceArtifact
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/DocumentArtifactType" } }
      responses:
        "200":
          description: Archivo
          content:
            application/xml: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Lista categorías de la empresa activa.
      operationId: listCategories
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Categorías, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryPage" } } } } }
    post:
      tags: [Catalog]
      summary: Crea una categoría de la empresa activa.
      operationId: createCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "201": { description: Categoría creada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "422": { $ref: "#/components/responses/ValidationError" } }
  /api/v1/categories/{category}:
    parameters:
      - { name: category, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Catalog]
      summary: Consulta una categoría de la empresa activa.
      operationId: getCategory
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Categoría, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "404": { $ref: "#/components/responses/NotFoundError" } }
    patch:
      tags: [Catalog]
      summary: Actualiza una categoría de la empresa activa.
      operationId: updateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "200": { description: Categoría actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "404": { $ref: "#/components/responses/NotFoundError" }, "409": { $ref: "#/components/responses/ConflictError" } }
  /api/v1/categories/{category}/activate:
    post:
      tags: [Catalog]
      summary: Activa una categoría existente.
      operationId: activateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses: { "200": { description: Categoría activada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" } }
  /api/v1/categories/{category}/deactivate:
    post:
      tags: [Catalog]
      summary: Desactiva una categoría sin borrarla físicamente.
      operationId: deactivateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses: { "200": { description: Categoría desactivada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" } }
  /api/v1/fiscal-payment-methods:
    get:
      tags: [Catalog]
      summary: Lista las formas fiscales de pago vigentes; no procesa transacciones.
      operationId: listFiscalPaymentMethods
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Catálogo fiscal global vigente, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalPaymentMethodPage" } } } } }
  /api/v1/fiscal-profile:
    get:
      tags: [Companies]
      summary: Consulta los atributos tributarios de la empresa activa.
      operationId: getFiscalProfile
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Perfil fiscal, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalProfileResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" } }
    patch:
      tags: [Companies]
      summary: Actualiza los atributos tributarios de la empresa activa.
      operationId: updateFiscalProfile
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalProfileInput" } } } }
      responses: { "200": { description: Perfil fiscal actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalProfileResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "422": { $ref: "#/components/responses/ValidationError" } }
  /api/v1/setup/status:
    get:
      tags: [Setup]
      summary: Calcula el estado real de configuracion fiscal de la empresa activa.
      operationId: getCompanySetupStatus
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Estado calculado por FACSTO API.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/setup/defer:
    post:
      tags: [Setup]
      summary: Omite la bienvenida para el administrador actual; no vuelve a mostrarse.
      description: Sólo OWNER o ADMIN. La decisión es de ese administrador en esa empresa y no afecta al otro administrador. No cambia la configuración fiscal.
      operationId: deferCompanySetup
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Bienvenida marcada como omitida; `onboardingRequired` pasa a falso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/setup/issuer:
    put:
      tags: [Setup]
      summary: Configura la identidad fiscal del emisor.
      operationId: configureIssuer
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuerConfiguration" }
      responses:
        "200":
          description: Configuracion guardada y estado recalculado.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/setup/emission:
    put:
      tags: [Setup]
      summary: Configura establecimiento matriz, punto predeterminado y ambiente SRI.
      operationId: configureEmissionStructure
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmissionConfiguration" }
      responses:
        "200":
          description: Estructura guardada y estado recalculado.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/setup/certificate:
    post:
      tags: [Setup]
      summary: Inspecciona un certificado P12/PFX y sólo lo guarda si puede firmar para el RUC del emisor.
      description: >-
        Rechaza con 422 y conserva sólo metadata (el archivo y la contraseña se descartan): CERTIFICATE_INVALID
        (`details.reason`: INVALID_FILE_OR_PASSWORD, PRIVATE_KEY_MISSING, INVALID_CERTIFICATE), CERTIFICATE_EXPIRED,
        CERTIFICATE_NOT_YET_VALID, CERTIFICATE_RUC_NOT_FOUND (sin RUC identificable en el OID 1.3.6.1.4.1.37947.3.11) y
        CERTIFICATE_RUC_MISMATCH (`details.companyRuc`, `details.certificateRuc`).
      operationId: uploadDigitalCertificate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadCertificateRequest" }
      responses:
        "201":
          description: Resumen del certificado sin rutas privadas ni secretos.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DigitalCertificateResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/setup/certificate/{certificate}:
    delete:
      tags: [Setup]
      summary: Desactiva un certificado de la empresa activa sin borrar su metadata.
      operationId: deactivateDigitalCertificate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: certificate
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Certificado desactivado.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DigitalCertificateResponse" }
        "404": { $ref: "#/components/responses/NotFoundError" }
