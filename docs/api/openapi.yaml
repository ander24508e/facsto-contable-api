openapi: 3.1.0
info:
  title: FACSTO API
  version: 1.0.0
  description: API fiscal de FACSTO. La autenticación de FACSTO Web usa cookies de sesión y CSRF.
servers:
  - url: http://localhost:8000
tags:
  - name: System
  - name: Authentication
  - name: Companies
  - name: Fiscal structure
  - name: Customers
  - name: Catalog
  - name: Sales
  - name: Setup
paths:
  /health:
    get:
      tags: [System]
      summary: Comprueba la disponibilidad de FACSTO y sus dependencias.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API, PostgreSQL, Redis y almacenamiento privado disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Una o más dependencias no están disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      summary: Inicializa las cookies CSRF para la sesión SPA.
      operationId: initializeCsrf
      security: []
      responses:
        "204":
          description: Laravel emitió las cookies XSRF-TOKEN y de sesión.
  /register:
    post:
      tags: [Authentication]
      summary: Registra un usuario FACSTO e inicia su sesión.
      operationId: register
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "419":
          $ref: "#/components/responses/CsrfError"
  /login:
    post:
      tags: [Authentication]
      summary: Autentica al usuario y establece la cookie de sesión.
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "419":
          $ref: "#/components/responses/CsrfError"
  /logout:
    post:
      tags: [Authentication]
      summary: Cierra la sesión FACSTO actual.
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "419":
          $ref: "#/components/responses/CsrfError"
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Devuelve el usuario de la sesión actual.
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /api/v1/companies:
    get:
      tags: [Companies]
      summary: Lista las empresas con membresía activa para el usuario.
      operationId: listCompanies
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Empresas accesibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCollection"
        "401":
          $ref: "#/components/responses/AuthenticationError"
    post:
      tags: [Companies]
      summary: Crea una empresa y asigna al usuario actual como OWNER.
      operationId: createCompany
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWrite"
      responses:
        "201":
          description: Empresa y membresía OWNER creadas en una transacción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/companies/{company}:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
    get:
      tags: [Companies]
      summary: Consulta una empresa accesible mediante su UUID público.
      operationId: getCompany
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Empresa solicitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Companies]
      summary: Actualiza una empresa con permisos de ADMIN u OWNER.
      operationId: updateCompany
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatch"
      responses:
        "200":
          description: Empresa actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/companies/{company}/logo:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
    get:
      tags: [Companies]
      summary: Devuelve el logo privado a miembros activos de la empresa.
      operationId: getCompanyLogo
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Archivo de imagen del logo.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Companies]
      summary: Sube o reemplaza el logo de la empresa en almacenamiento privado.
      operationId: uploadCompanyLogo
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPG o WebP de hasta 3 MB.
      responses:
        "200":
          description: Logo actualizado; la ruta privada no se expone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Companies]
      summary: Quita el logo de la empresa.
      operationId: deleteCompanyLogo
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Logo eliminado del almacenamiento privado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
  /api/v1/companies/{company}/members:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
    post:
      tags: [Companies]
      summary: Agrega un usuario a la empresa con un rol local.
      operationId: addCompanyMember
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userPublicId, role]
              properties:
                userPublicId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/CompanyRole" }
      responses:
        "201":
          description: Membresía creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/companies/{company}/members/{userPublicId}:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
      - name: userPublicId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Companies]
      summary: Desactiva la membresía, protegiendo al último OWNER activo.
      operationId: removeCompanyMember
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Membresía desactivada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isActive: { type: boolean, const: false }
        "403":
          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/v1/companies/{company}/members/{userPublicId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
      - {
          name: userPublicId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [Companies]
      summary: Reactiva la membresía conservada de un usuario.
      operationId: reactivateCompanyMember
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          {
            description: Membresía reactivada,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipResponse" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/companies/{company}/members/{userPublicId}/role:
    parameters:
      - $ref: "#/components/parameters/CompanyPublicId"
      - {
          name: userPublicId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [Companies]
      summary: Cambia un rol respetando la jerarquía OWNER y ADMIN.
      operationId: updateCompanyMemberRole
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [role],
                      properties:
                        { role: { $ref: "#/components/schemas/CompanyRole" } },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Rol actualizado,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MembershipResponse" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/dashboard/summary:
    get:
      tags: [Sales]
      summary: Devuelve un resumen operativo agregado para la empresa activa.
      operationId: getDashboardSummary
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200":
          description: Conteos y borradores recientes; no incluye métricas fiscales inexistentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummaryResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/sales:
    get:
      tags: [Sales]
      summary: Lista borradores y ventas canceladas de la empresa activa.
      operationId: listSales
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SaleStatus" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Página de ventas de la empresa seleccionada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalePage" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Sales]
      summary: Crea un borrador y calcula sus valores en FACSTO API.
      operationId: createSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleDraftRequest" }
      responses:
        "201":
          description: Borrador guardado con snapshots de cliente, artículo e impuestos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sales/{sale}:
    parameters:
      - name: sale
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/FacstoCompany"
    get:
      tags: [Sales]
      summary: Consulta un borrador por UUID público dentro de la empresa activa.
      operationId: getSale
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Datos y snapshots del borrador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    patch:
      tags: [Sales]
      summary: Recalcula y actualiza un borrador que todavía no fue cancelado.
      operationId: updateSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleDraftRequest" }
      responses:
        "200":
          description: Borrador actualizado y recalculado en Laravel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sales/{sale}/cancel:
    post:
      tags: [Sales]
      summary: Cancela un borrador sin eliminarlo físicamente.
      operationId: cancelSaleDraft
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: sale
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200":
          description: Borrador marcado como CANCELLED y auditado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/sales/{sale}/invoice:
    post:
      tags: [FiscalDocuments]
      summary: Convierte un borrador listo en factura numerada; no la envía al SRI.
      operationId: createInvoiceFromSale
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: sale, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "201": { description: Factura numerada, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/invoices:
    get:
      tags: [FiscalDocuments]
      summary: Lista facturas numeradas de la empresa activa.
      operationId: listInvoices
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DocumentStatus" } }
      responses:
        "200": { description: Página de comprobantes fiscales, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentPage" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/invoices/{invoice}:
    get:
      tags: [FiscalDocuments]
      summary: Consulta un comprobante mediante su UUID público.
      operationId: getInvoice
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200": { description: Identidad fiscal y snapshots, content: { application/json: { schema: { $ref: "#/components/schemas/ElectronicDocumentResponse" } } } }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Lista categorías de la empresa activa.
      operationId: listCategories
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FacstoCompany" }]
      responses: { "200": { description: Categorías, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryPage" } } } } }
    post:
      tags: [Catalog]
      summary: Crea una categoría de la empresa activa.
      operationId: createCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: "#/components/parameters/FacstoCompany" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "201": { description: Categoría creada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "422": { $ref: "#/components/responses/ValidationError" } }
  /api/v1/categories/{category}:
    parameters:
      - { name: category, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/FacstoCompany"
    get:
      tags: [Catalog]
      summary: Consulta una categoría de la empresa activa.
      operationId: getCategory
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Categoría, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "404": { $ref: "#/components/responses/NotFoundError" } }
    patch:
      tags: [Catalog]
      summary: Actualiza una categoría de la empresa activa.
      operationId: updateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "200": { description: Categoría actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" }, "404": { $ref: "#/components/responses/NotFoundError" }, "409": { $ref: "#/components/responses/ConflictError" } }
  /api/v1/categories/{category}/activate:
    post:
      tags: [Catalog]
      summary: Activa una categoría existente.
      operationId: activateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/FacstoCompany" }]
      responses: { "200": { description: Categoría activada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" } }
  /api/v1/categories/{category}/deactivate:
    post:
      tags: [Catalog]
      summary: Desactiva una categoría sin borrarla físicamente.
      operationId: deactivateCategory
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/FacstoCompany" }]
      responses: { "200": { description: Categoría desactivada, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponse" } } } }, "403": { $ref: "#/components/responses/CompanyAccessError" } }
  /api/v1/fiscal-payment-methods:
    get:
      tags: [Catalog]
      summary: Lista las formas fiscales de pago vigentes; no procesa transacciones.
      operationId: listFiscalPaymentMethods
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FacstoCompany" }]
      responses: { "200": { description: Catálogo fiscal global vigente, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalPaymentMethodPage" } } } } }
  /api/v1/setup/status:
    get:
      tags: [Setup]
      summary: Calcula el estado real de configuracion fiscal de la empresa activa.
      operationId: getCompanySetupStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200":
          description: Estado calculado por FACSTO API.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/setup/defer:
    post:
      tags: [Setup]
      summary: Posponer la configuracion fiscal inicial de la empresa activa.
      operationId: deferCompanySetup
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200":
          description: La configuracion queda pospuesta y su estado fiscal conserva el valor real.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/setup/resume:
    post:
      tags: [Setup]
      summary: Reanudar la configuracion fiscal inicial de la empresa activa.
      operationId: resumeCompanySetup
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      responses:
        "200":
          description: Devuelve el paso pendiente calculado por FACSTO API.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanySetupStatusResponse" }
        "403": { $ref: "#/components/responses/CompanyAccessError" }
  /api/v1/setup/issuer:
    put:
      tags: [Setup]
      summary: Configura la identidad fiscal del emisor.
      operationId: configureIssuer
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/FacstoCompany"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuerConfiguration" }
      responses:
        "200":
          description: Configuracion guardada y estado recalculado.
          content:
