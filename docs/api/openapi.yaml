          $ref: "#/components/responses/CompanyAccessError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/emission-points:
    get:
      tags: [Fiscal structure]
      summary: Lista puntos de emisión de la empresa activa.
      operationId: listEmissionPoints
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Puntos de emisión de la empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionPointCollection"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/CompanyAccessError"
    post:
