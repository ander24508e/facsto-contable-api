; Producción: el código no cambia dentro del contenedor (cada despliegue construye una imagen nueva).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

expose_php=Off
display_errors=Off
log_errors=On
memory_limit=256M
max_execution_time=120
